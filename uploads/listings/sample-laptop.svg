<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)" rx="16"/>
  <!-- Laptop body -->
  <rect x="250" y="200" width="300" height="190" rx="10" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="4"/>
  <rect x="265" y="215" width="270" height="150" rx="4" fill="#0f172a"/>
  <!-- Screen glow -->
  <circle cx="400" cy="290" r="30" fill="#38bdf8" opacity="0.8"/>
  <path d="M375 330 L425 330" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <!-- Keyboard base -->
  <path d="M210 400 L590 400 L570 425 L230 425 Z" fill="#94a3b8"/>
  <rect x="360" y="405" width="80" height="8" rx="3" fill="#cbd5e1"/>
  <!-- Text -->
  <text x="400" y="500" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="700" text-anchor="middle">MacBook Air M1</text>
  <text x="400" y="535" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">Electronics • Space Gray</text>
</svg>
